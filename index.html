<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boîte à Noublard</title>
<style>
:root{--bg:#14121a;--card:#201d2b;--txt:#f3f0ff;--mut:#9b94b5;--acc:#ffcc33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.3 system-ui,sans-serif;padding:0 12px 40px;-webkit-user-select:none;user-select:none}
header{text-align:center;padding:18px 0 8px}
h1{margin:0;font-size:1.7rem;letter-spacing:.5px}
h1 span{color:var(--acc)}
.panel{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px auto;max-width:900px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.ctl{flex:1 1 220px;min-width:200px}
.ctl label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin-bottom:2px}
.ctl label b{color:var(--acc);font-weight:600}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.tog,#stop{border:0;border-radius:999px;padding:7px 13px;background:#2f2b40;color:var(--txt);font:inherit;font-size:.85rem;cursor:pointer}
.chip:active,.tog.on{background:var(--acc);color:#1a1500}
#stop{background:#5a2330}
h2{max-width:900px;margin:18px auto 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:2px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:900px;margin:0 auto}
.pad{position:relative;border:0;border-radius:14px;min-height:78px;padding:10px 8px;color:#fff;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;background:hsl(var(--h) 55% 38%);box-shadow:0 4px 0 hsl(var(--h) 55% 24%);transition:transform .05s,box-shadow .05s,filter .1s;touch-action:manipulation}
.pad.hit{transform:translateY(4px);box-shadow:0 0 0 hsl(var(--h) 55% 24%);filter:brightness(1.35)}
.pad kbd{position:absolute;top:5px;right:7px;font:600 .7rem monospace;opacity:.55}
footer{text-align:center;color:var(--mut);font-size:.75rem;margin-top:26px}
#msg{text-align:center;color:#ff8a8a;display:none;margin:10px}
</style>
</head>
<body>
<header><h1>Boîte à <span>Noublard</span></h1></header>
<div id="msg"></div>
<div class="panel">
 <div class="row">
  <div class="ctl"><label>Vitesse <b id="vs">1.00×</b></label><input id="speed" type="range" min="0.4" max="2.5" step="0.01" value="1"></div>
  <div class="ctl"><label>Hauteur <b id="ps">0 demi-ton</b></label><input id="pitch" type="range" min="-12" max="12" step="0.5" value="0"></div>
 </div>
 <div class="row" style="margin-top:10px">
  <div class="chips" id="presets"></div>
 </div>
 <div class="row" style="margin-top:10px">
  <button class="tog" id="rnd">🎲 Aléatoire</button>
  <button class="tog" id="rev">⏪ À l'envers</button>
  <button id="stop">⏹ Tout couper</button>
 </div>
</div>
<div id="pads"></div>
<footer>Clique (ou tape au clavier) · spamme un bouton pour relancer le son · Vitesse et Hauteur se cumulent comme un magnéto</footer>
<script>

"b1-01", "label": "Réaction (00:22)", "cat": "Bande 1", "file": "sons/b1-01.mp3"}, {"id": "b1-02", "label": "Réaction (00:32)", "cat": "Bande 1", "file": "sons/b1-02.mp3"}, {"id": "b1-03", "label": "Réaction (01:56)", "cat": "Bande 1", "file": "sons/b1-03.mp3"}, {"id": "b1-04", "label": "Réaction (02:01)", "cat": "Bande 1", "file": "sons/b1-04.mp3"}, {"id": "b1-05", "label": "Réaction (02:48)", "cat": "Bande 1", "file": "sons/b1-05.mp3"}, {"id": "b1-06", "label": "Réaction (03:55)", "cat": "Bande 1", "file": "sons/b1-06.mp3"}, {"id": "b1-07", "label": "Oh ! (12:14)", "cat": "Bande 1", "file": "sons/b1-07.mp3"}, {"id": "b1-08", "label": "Oh ! (13:29)", "cat": "Bande 1", "file": "sons/b1-08.mp3"}, {"id": "b1-09", "label": "Oh ! (13:34)", "cat": "Bande 1", "file": "sons/b1-09.mp3"}, {"id": "b1-10", "label": "Réaction (13:45)", "cat": "Bande 1", "file": "sons/b1-10.mp3"}, {"id": "b1-11", "label": "Réaction (14:07)", "cat": "Bande 1", "file": "sons/b1-11.mp3"}, {"id": "b1-12", "label": "Quoi ?", "cat": "Bande 1", "file": "sons/b1-12.mp3"}, {"id": "b1-13", "label": "Noooon ! C'était ça !", "cat": "Bande 1", "file": "sons/b1-13.mp3"}, {"id": "b1-14", "label": "Oh ! (16:25)", "cat": "Bande 1", "file": "sons/b1-14.mp3"}, {"id": "b1-15", "label": "Oh ! (16:55)", "cat": "Bande 1", "file": "sons/b1-15.mp3"}, {"id": "b1-16", "label": "Oh ! (17:01)", "cat": "Bande 1", "file": "sons/b1-16.mp3"}, {"id": "b1-17", "label": "Oh non", "cat": "Bande 1", "file": "sons/b1-17.mp3"}, {"id": "b1-18", "label": "Oh ! (22:00)", "cat": "Bande 1", "file": "sons/b1-18.mp3"}, {"id": "b1-19", "label": "Réaction (23:43)", "cat": "Bande 1", "file": "sons/b1-19.mp3"}, {"id": "b1-20", "label": "Noooon !", "cat": "Bande 1", "file": "sons/b1-20.mp3"}, {"id": "b1-21", "label": "Et ça va oui !", "cat": "Bande 1", "file": "sons/b1-21.mp3"}, {"id": "b1-22", "label": "Réaction (27:15)", "cat": "Bande 1", "file": "sons/b1-22.mp3"}, {"id": "b1-23", "label": "C'est bon ça", "cat": "Bande 1", "file": "sons/b1-23.mp3"}, {"id": "b1-24", "label": "Réaction (28:02)", "cat": "Bande 1", "file": "sons/b1-24.mp3"}, {"id": "b1-25", "label": "Noooooo", "cat": "Bande 1", "file": "sons/b1-25.mp3"}, {"id": "b1-26", "label": "Ouais c'est ça ouais", "cat": "Bande 1", "file": "sons/b1-26.mp3"}, {"id": "b1-27", "label": "Réaction (29:20)", "cat": "Bande 1", "file": "sons/b1-27.mp3"}, {"id": "b1-28", "label": "Réaction (31:17)", "cat": "Bande 1", "file": "sons/b1-28.mp3"}, {"id": "b1-29", "label": "Arrête, tu me tues", "cat": "Bande 1", "file": "sons/b1-29.mp3"}, {"id": "b1-30", "label": "Oh oh oh", "cat": "Bande 1", "file": "sons/b1-30.mp3"}, {"id": "b1-31", "label": "Oh ! (34:26)", "cat": "Bande 1", "file": "sons/b1-31.mp3"}, {"id": "b1-32", "label": "Réaction (35:53)", "cat": "Bande 1", "file": "sons/b1-32.mp3"}, {"id": "b1-33", "label": "Oh ! (38:15)", "cat": "Bande 1", "file": "sons/b1-33.mp3"}, {"id": "b1-34", "label": "Réaction (39:38)", "cat": "Bande 1", "file": "sons/b1-34.mp3"}, {"id": "b1-35", "label": "Oh ! (42:09)", "cat": "Bande 1", "file": "sons/b1-35.mp3"}, {"id": "b1-36", "label": "Oh ! (42:47)", "cat": "Bande 1", "file": "sons/b1-36.mp3"}, {"id": "b2-37", "label": "Oh ! (00:03)", "cat": "Bande 2 (extras)", "file": "sons/b2-37.mp3"}, {"id": "b2-38", "label": "Oh ! (00:15)", "cat": "Bande 2 (extras)", "file": "sons/b2-38.mp3"}, {"id": "b2-39", "label": "Oh ! (00:51)", "cat": "Bande 2 (extras)", "file": "sons/b2-39.mp3"}, {"id": "b2-40", "label": "Réaction (01:06)", "cat": "Bande 2 (extras)", "file": "sons/b2-40.mp3"}, {"id": "b2-41", "label": "Réaction (01:17)", "cat": "Bande 2 (extras)", "file": "sons/b2-41.mp3"}, {"id": "b2-42", "label": "Réaction (03:46)", "cat": "Bande 2 (extras)", "file": "sons/b2-42.mp3"}, {"id": "b2-43", "label": "Je suis mort (clean)", "cat": "Bande 2 (extras)", "file": "sons/b2-43.mp3"}, {"id": "b2-44", "label": "Oh putain (clean)", "cat": "Bande 2 (extras)", "file": "sons/b2-44.mp3"}, {"id": "b2-45", "label": "Réaction (07:21)", "cat": "Bande 2 (extras)", "file": "sons/b2-45.mp3"}, {"id": "b2-46", "label": "Oh ! Toi !", "cat": "Bande 2 (extras)", "file": "sons/b2-46.mp3"}, {"id": "b2-47", "label": "Oh ! Toi ! (bis)", "cat": "Bande 2 (extras)", "file": "sons/b2-47.mp3"}, {"id": "b2-48", "label": "Réaction (08:52)", "cat": "Bande 2 (extras)", "file": "sons/b2-48.mp3"}, {"id": "b2-49", "label": "Il y a quelqu'un qui ne meurt pas", "cat": "Bande 2 (extras)", "file": "sons/b2-49.mp3"}, {"id": "b2-50", "label": "Oh ! (10:00)", "cat": "Bande 2 (extras)", "file": "sons/b2-50.mp3"}, {"id": "b2-51", "label": "Réaction (10:16)", "cat": "Bande 2 (extras)", "file": "sons/b2-51.mp3"}, {"id": "b2-52", "label": "Réaction (10:30)", "cat": "Bande 2 (extras)", "file": "sons/b2-52.mp3"}, {"id": "b2-53", "label": "Oh ! (10:41)", "cat": "Bande 2 (extras)", "file": "sons/b2-53.mp3"}, {"id": "b2-54", "label": "Réaction (10:47)", "cat": "Bande 2 (extras)", "file": "sons/b2-54.mp3"}, {"id": "b2-55", "label": "Réaction (11:07)", "cat": "Bande 2 (extras)", "file": "sons/b2-55.mp3"}];
const KEYS="azertyuiopqsdfghjklmwxcvbn1234567890";
const HUES={"Phrases":265,"Jurons":0,"Cris":35,"Bande 1":180,"Bande 2 (extras)":120};
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const master=ctx.createGain();master.gain.value=0.9;
const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
const buffers={},bwd={},playing={};
let speed=1,pitch=0,rnd=false,rev=false;
const $=id=>document.getElementById(id);

function reversed(b){const r=ctx.createBuffer(b.numberOfChannels,b.length,b.sampleRate);
 for(let c=0;c<b.numberOfChannels;c++){const s=b.getChannelData(c),d=r.getChannelData(c);for(let i=0;i<s.length;i++)d[i]=s[s.length-1-i]}return r}

async function load(){
 try{
  await Promise.all(SONS.map(async s=>{
   const r=await fetch(s.file);if(!r.ok)throw new Error(s.file);
   buffers[s.id]=await ctx.decodeAudioData(await r.arrayBuffer());
  }));
 }catch(e){const m=$("msg");m.style.display="block";m.textContent="Impossible de charger les sons (ouvre la page via un serveur / GitHub Pages, pas en file://).";}
}

function play(id,el){
 if(ctx.state!=="running")ctx.resume();
 let b=buffers[id];if(!b)return;
 if(rev){bwd[id]=bwd[id]||reversed(b);b=bwd[id]}
 if(playing[id]){try{playing[id].stop()}catch(e){}}
 const src=ctx.createBufferSource();src.buffer=b;
 let semis=pitch;if(rnd)semis+=(Math.random()*20-10);
 const sp=rnd?speed*(0.85+Math.random()*0.3):speed;
 src.playbackRate.value=sp;src.detune.value=semis*100;
 src.connect(master);
 src.onended=()=>{if(playing[id]===src)delete playing[id]};
 playing[id]=src;src.start();
 if(el){el.classList.add("hit");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("hit"),90)}
}
function stopAll(){for(const k in playing){try{playing[k].stop()}catch(e){}}}

const cats=[...new Set(SONS.map(s=>s.cat))];const padEl={};
for(const c of cats){
 const h=document.createElement("h2");h.textContent=c;$("pads").appendChild(h);
 const g=document.createElement("div");g.className="grid";$("pads").appendChild(g);
 SONS.filter(s=>s.cat===c).forEach((s,i)=>{
  const b=document.createElement("button");b.className="pad";b.style.setProperty("--h",(HUES[c]+i*7)%360);
  b.textContent=s.label;
  const k=KEYS[SONS.indexOf(s)];if(k){const kb=document.createElement("kbd");kb.textContent=k.toUpperCase();b.appendChild(kb);padEl[k]=[s.id,b]}
  b.addEventListener("pointerdown",e=>{e.preventDefault();play(s.id,b)});
  g.appendChild(b);
 });
}
addEventListener("keydown",e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;const p=padEl[e.key.toLowerCase()];if(p)play(p[0],p[1])});

function upd(){$("vs").textContent=speed.toFixed(2)+"×";$("ps").textContent=(pitch>0?"+":"")+pitch+" demi-ton"+(Math.abs(pitch)>1?"s":"")}
$("speed").oninput=e=>{speed=+e.target.value;upd()};
$("pitch").oninput=e=>{pitch=+e.target.value;upd()};
const PRE=[["Normal",1,0],["Démon 😈",0.8,-7],["Géant",0.6,-12],["Chipmunk 🐿️",1.3,9],["Robot en panne",0.5,-3],["Speed ⚡",2,0]];
for(const [n,s,p] of PRE){const b=document.createElement("button");b.className="chip";b.textContent=n;
 b.onclick=()=>{speed=s;pitch=p;$("speed").value=s;$("pitch").value=p;upd()};$("presets").appendChild(b)}
$("rnd").onclick=e=>{rnd=!rnd;e.currentTarget.classList.toggle("on",rnd)};
$("rev").onclick=e=>{rev=!rev;e.currentTarget.classList.toggle("on",rev)};
$("stop").onclick=stopAll;
addEventListener("pointerdown",()=>{if(ctx.state!=="running")ctx.resume()});
upd();load();
</script>
</body>
</html>
